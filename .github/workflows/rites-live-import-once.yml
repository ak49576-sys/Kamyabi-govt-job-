name: RITES Live Import Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rites-live-import-once.yml

permissions:
  contents: read

concurrency:
  group: kamyabi-rites-live-import-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test submission safeguards
        run: python -m unittest -v test_submit_jobs.py
      - name: Publish approved RITES record
        env:
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
        run: python submit_jobs.py --file reviewed-rites-jobs.json --submit --output output/rites-live-import.json
      - name: Add API counts to summary
        if: always()
        run: |
          if [ -f output/rites-live-import.json ]; then
            echo '### RITES live import result' >> "$GITHUB_STEP_SUMMARY"
            cat output/rites-live-import.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save live import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rites-live-import-report
          path: output/
          retention-days: 30
          if-no-files-found: warn
