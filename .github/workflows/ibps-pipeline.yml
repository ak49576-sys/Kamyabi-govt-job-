# 1. Verify current state
cat .github/workflows/ibps-pipeline.yml | grep -E "python|monitor|source"

# 2. Check that daily-check.yml is separate and untouched
ls .github/workflows/

# 3. Download only the replacement workflow
curl -fsSL https://kamyabi.in/data/ibps-pipeline.yml \
  -o .github/workflows/ibps-pipeline.yml

# 4. Verify the replacement
grep "monitor.py" .github/workflows/ibps-pipeline.yml   # must return nothing
grep "source=ibps" .github/workflows/ibps-pipeline.yml  # must return a match
grep "schedule" .github/workflows/ibps-pipeline.yml     # must return nothing

# 5. Commit
git add .github/workflows/ibps-pipeline.yml
git commit -m "Fix ibps-pipeline.yml: replace Python/monitor.py with TypeScript pipeline

Previous file called monitor.py unconditionally; SOURCE env var was set
but monitor.py did not filter by it, causing UPSC/RPSC/RSSB to run.
push trigger caused automatic runs on every relevant file change.

Replacement:
- Calls pipeline.ts --source=ibps only
- workflow_dispatch only (no push trigger, no schedule)
- dry_run=true by default
- Fails only on genuine IBPS errors
- monitor.py, scraper.py, daily-check.yml untouched"
git push
