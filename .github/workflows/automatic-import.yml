name: Stage reviewed jobs for admin approval
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'reviewed-*-jobs.json'
      - 'auto_import.py'
      - 'test_auto_import.py'
      - '.github/workflows/automatic-import.yml'
permissions:
  contents: read
concurrency:
  group: kamyabi-ibps-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test import safeguards
        run: python -m unittest -v test_submit_jobs.py test_auto_import.py
      - name: Stage changed reviewed jobs
        if: github.event_name == 'push'
        env:
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$GITHUB_SHA" -- 'reviewed-*-jobs.json')
          if (( ${#changed[@]} == 0 )); then
            echo 'No new or modified reviewed job files to stage.'
            exit 0
          fi
          python auto_import.py --submit --files "${changed[@]}"
      - name: Manually stage reviewed jobs
        if: github.event_name == 'workflow_dispatch'
        env:
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
        run: python auto_import.py --submit
      - name: Record staging status
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          report = Path('output/automatic-import.json')
          if report.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Automatic reviewed imports\n\n```json\n' + report.read_text() + '\n```\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-import-report
          path: output/automatic-import.json
          retention-days: 30
