name: Isolated MySQL duplicate-reservation integration

on:
  push:
    branches:
      - feature/smart-publish-safety-dry-run
    paths:
      - 'safety_prototypes/mysql_atomic_identity.py'
      - 'safety_prototypes/test_mysql_atomic_identity.py'
      - 'safety_prototypes/atomic_job_identity.py'
      - '.github/workflows/mysql-identity-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-identity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kamyabi_safety_test
          MYSQL_ROOT_PASSWORD: local-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-test-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: local-test-only
      MYSQL_TEST_DATABASE: kamyabi_safety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated MySQL test driver
        run: python -m pip install mysql-connector-python==9.4.0
      - name: Test atomic identity reservation against disposable MySQL
        run: python -m unittest discover -s safety_prototypes -p 'test_mysql_atomic_identity.py' -v
