name: Smart publication safety dry run
on:
  push:
    branches:
      - feature/smart-publish-safety-dry-run
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only gate tests
        run: python -m unittest -v test_smart_publish_gate.py test_smart_publish_preview.py test_public_inventory_probe.py test_admin_inventory_readonly.py test_prepare_airo_safety_patch.py
  api-contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated read-only status endpoint
        env:
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
        run: python check_api.py
      - name: Save nonsecret API status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-publish-api-contract-check
          path: output/api-check.json
          retention-days: 7
          if-no-files-found: warn
  public-feed-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public inventory contract (read only)
        run: python public_inventory_probe.py
  admin-inventory-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Attempt authorized read-only inventory enumeration
        env:
          KAMYABI_ADMIN_READ_KEY: ${{ secrets.KAMYABI_API_KEY }}
        run: python admin_inventory_readonly.py
        continue-on-error: true
