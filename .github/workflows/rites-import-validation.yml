name: Validate RITES Import Record

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reviewed-rites-jobs.json
      - submit_jobs.py
      - test_submit_jobs.py
      - .github/workflows/rites-import-validation.yml

permissions:
  contents: read

concurrency:
  group: kamyabi-rites-import-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test submission safeguards
        run: python -m unittest -v test_submit_jobs.py
      - name: Validate reviewed RITES record without submission
        run: python submit_jobs.py --file reviewed-rites-jobs.json --output output/rites-import.json
      - name: Add result to summary
        if: always()
        run: |
          if [ -f output/rites-import.json ]; then
            echo '### RITES validation result' >> "$GITHUB_STEP_SUMMARY"
            cat output/rites-import.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save RITES validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rites-import-validation-report
          path: output/
          retention-days: 30
          if-no-files-found: warn
