name: Daily official recruitment check
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    paths: ['monitor.py', 'sources.json', 'test_monitor.py', '.github/workflows/daily-check.yml']
permissions:
  contents: read
concurrency:
  group: kamyabi-daily-check
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parsing and domain checks
        run: python -m unittest -v test_monitor.py
      - name: Collect official notice links
        run: python monitor.py
      - name: Add report to run summary
        if: always()
        run: |
          if [ -f output/summary.md ]; then
            cat output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save recruitment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-report
          path: output/
          retention-days: 30
          if-no-files-found: warn
