name: Apify Dataset Review for Kamyabi

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST; GitHub schedules may be delayed
  push:
    branches: [main]
    paths: ['.github/workflows/apify-kamyabi-review.yml', 'match_official_notices.py', 'test_match_official_notices.py', 'auto_publish.py', 'test_auto_publish.py', 'official-sources-expanded.json', 'auto_import.py', 'source_validation.py', 'monitor.py', 'triage_official_notices.py', 'test_triage_official_notices.py', 'inspect_existing_job_dates.py', 'verify_ongc_apprentice_pdf.py', 'review_official_pdfs.py', 'test_review_official_pdfs.py', 'stage_missing_reviewed.py', 'test_stage_missing_reviewed.py', 'verify_publications.py', 'test_verify_publications.py', 'enrich_official_review.py', 'test_enrich_official_review.py', 'audit_public_jobs.py', 'test_audit_public_jobs.py']
  workflow_dispatch:
    inputs:
      reviewed_jobs_json:
        description: 'Optional reviewed=true JSON document with verified jobs (1–100); leave blank for report only'
        required: false
        type: string
      reviewed_filename:
        description: 'Required when submitting from repository files instead of pasted JSON (e.g. reviewed-sbi-sco-nov-2026-jobs.json)'
        required: false
        type: string
      publish_eligible:
        description: 'Approve currently pending, basic-qualified reviewed repository jobs (requires separate admin API key)'
        required: false
        default: false
        type: boolean
      submit_reviewed:
        description: 'Stage reviewed JSON input or existing reviewed-*-jobs.json files (never publishes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kamyabi-apify-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned PDF text reader
        run: python -m pip install --disable-pip-version-check pypdf==6.21.4
      - name: Test API validation and pending-import safeguards
        run: python -m unittest -v test_submit_jobs.py test_auto_import.py test_check_api.py test_match_official_notices.py test_auto_publish.py test_monitor.py test_source_validation.py test_triage_official_notices.py test_review_official_pdfs.py test_stage_missing_reviewed.py test_verify_publications.py test_enrich_official_review.py test_audit_public_jobs.py
      - name: Fetch Apify CSV and create review report
        env:
          APIFY_DATASET_URL: ${{ secrets.APIFY_DATASET_URL }}
        run: |
          set -euo pipefail
          test -n "$APIFY_DATASET_URL" || { echo "::error::APIFY_DATASET_URL secret is empty or missing"; exit 1; }
          mkdir -p output
          curl --globoff --fail --silent --show-error --location --max-time 60 \
            "$APIFY_DATASET_URL" -o /tmp/apify-dataset.csv
          python - <<'PY'
          import csv, json, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          src = Path('/tmp/apify-dataset.csv')
          out = Path('output')
          required = {'postName', 'detailUrl', 'lastDate', 'recruitmentBoard'}
          with src.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              headers = set(reader.fieldnames or [])
              missing = sorted(required - headers)
              if missing:
                  raise SystemExit('CSV schema mismatch; missing columns: ' + ', '.join(missing))
              rows = list(reader)
          if not rows:
              raise SystemExit('Apify dataset returned zero rows; refusing to treat this as a successful collection.')
          seen = set()
          today_ist = datetime.now(ZoneInfo('Asia/Kolkata')).date()
          report = []
          for row in rows:
              title = (row.get('postName') or '').strip()
              url = (row.get('detailUrl') or '').strip()
              key = (title.casefold(), url.casefold())
              if key in seen:
                  continue
              seen.add(key)
              from urllib.parse import urlparse
              parsed = urlparse(url)
              raw_deadline = (row.get('lastDate') or '').strip()
              deadline = None
              for fmt in ('%d-%m-%Y', '%Y-%m-%d'):
                  try:
                      deadline = datetime.strptime(raw_deadline, fmt).date()
                      break
                  except ValueError:
                      pass
              deadline_status = ('UNKNOWN_DATE' if deadline is None else
                                 'EXPIRED' if deadline < today_ist else 'OPEN_UNVERIFIED')
              report.append({
                  'title': title,
                  'recruitment_board': (row.get('recruitmentBoard') or '').strip(),
                  'last_date_as_scraped': raw_deadline,
                  'deadline_status': deadline_status,
                  'candidate_url': url,
                  'candidate_url_host': parsed.hostname or '',
                  'advt_no': (row.get('advtNo') or '').strip(),
                  'qualification_as_scraped': (row.get('qualification') or '').strip(),
                  'post_date_as_scraped': (row.get('postDate') or '').strip(),
                  'parse_confidence': (row.get('parse_confidence') or '').strip(),
                  'review_status': 'NEEDS_OFFICIAL_NOTIFICATION_VERIFICATION',
                  'publishable': False,
                  'review_note': 'Scraped candidate only. Confirm the vacancy and dates from the recruiting body official notification; do not publish from an aggregator link alone.'
              })
          report.sort(key=lambda item: (
              0 if item['deadline_status'] == 'OPEN_UNVERIFIED' else
              1 if item['deadline_status'] == 'UNKNOWN_DATE' else 2,
              item['last_date_as_scraped'], item['title']))
          fields = list(report[0].keys())
          with (out / 'apify-review.csv').open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(report)
          summary = {
              'fetched_at_utc': datetime.utcnow().replace(microsecond=0).isoformat() + 'Z',
              'source': 'Apify dataset CSV export',
              'raw_rows': len(rows),
              'unique_candidate_rows': len(report),
              'duplicates_removed': len(rows) - len(report),
              'open_unverified': sum(r['deadline_status'] == 'OPEN_UNVERIFIED' for r in report),
              'expired': sum(r['deadline_status'] == 'EXPIRED' for r in report),
              'unknown_deadline': sum(r['deadline_status'] == 'UNKNOWN_DATE' for r in report),
              'automatically_submitted_to_kamyabi': 0,
              'automatically_published': 0,
              'review_required_for_all_rows': True,
              'note': 'Raw Apify candidates are report-only. Separately reviewed repository records may be submitted on explicit manual request.'
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Apify → Kamyabi candidate review\n\n')
              f.write(f"- Raw rows fetched: **{len(rows)}**\n")
              f.write(f"- Unique candidate rows: **{len(report)}**\n")
              f.write(f"- Duplicates removed: **{len(rows)-len(report)}**\n")
              f.write(f"- Open but unverified: **{sum(r['deadline_status'] == 'OPEN_UNVERIFIED' for r in report)}**\n")
              f.write(f"- Expired: **{sum(r['deadline_status'] == 'EXPIRED' for r in report)}**\n")
              f.write(f"- Unknown deadline: **{sum(r['deadline_status'] == 'UNKNOWN_DATE' for r in report)}**\n")
              f.write('- Jobs submitted or published: **0**\n\n')
              f.write('Download the **apify-kamyabi-review** artifact and verify every item against the recruiting body’s official notification before adding it to a reviewed jobs file.\n')
          PY
      - name: Match SBI advertisement numbers against official careers page
        run: |
          python match_official_notices.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('output/sbi-official-match-summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## SBI official listing checks (not publication approval)\\n\\n')
              out.write(f"- Official page status: **{report['source_status']}**\\n")
              out.write(f"- SBI candidates: **{report['sbi_candidates']}**\\n")
              out.write(f"- Exact advertisement-number matches: **{report['advertisement_number_matches']}**\\n")
              out.write('- Fully verified and automatically published: **0**\\n')
          PY

      - name: Check expanded official sources (coverage report only)
        run: |
          mkdir -p output/official-coverage output/ssc
          python monitor.py --sources official-sources-expanded.json --output output/official-coverage || echo "::warning::Some official recruitment sources could not be reached; see coverage report"
          python triage_official_notices.py
          python review_official_pdfs.py
          python enrich_official_review.py
          python source_validation.py --source ssc --output output/ssc || echo "::warning::SSC official API unavailable; see report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          coverage = json.loads(Path('output/official-coverage/report.json').read_text())
          ssc = json.loads(Path('output/ssc/report.json').read_text())
          triage = json.loads(Path('output/official-coverage/triage-summary.json').read_text())
          pdf = json.loads(Path('output/official-coverage/pdf-evidence.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## Expanded official recruitment coverage (no automatic import)\\n\\n')
              for row in coverage['sources']:
                  out.write(f"- {row['source']}: **{row['status']}**, {row['candidate_records']} candidate links/cards\\n")
              out.write(f"- SSC: **{ssc['status']}**, {ssc['records_observed']} advertisement records\\n")
              out.write(f"- Priority review: **{triage['priority_review']}**; other review: **{triage['needs_review']}**; excluded historical/results: **{triage['excluded']}**\\n")
              out.write(f"- Official PDFs examined: **{len(pdf.get('documents', []))}**; text extracted: **{sum(d.get('status') == 'text_extracted' for d in pdf.get('documents', []))}**\n")
              out.write('- Unreachable sources and missing notification details stay on hold.\\n')
          PY

      - name: Preview eligible reviewed repository jobs (no write)
        run: |
          python auto_import.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('output/automatic-import.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n## Reviewed repository files (read-only preview)\n\n')
              out.write(f"- Eligible records: **{report.get('eligible', 0)}**\n")
              out.write(f"- Expired records: **{len(report.get('expired', []))}**\n")
              out.write(f"- Preview status: **{report.get('status', 'unknown')}**\n")
              out.write('- This preview does not submit jobs.\n')
          if report.get('status') != 'ok':
              raise SystemExit('Reviewed-job preview failed; investigate before submitting.')
          PY

      - name: Stage newly reviewed jobs missing from Kamyabi
        if: ${{ github.event_name == 'schedule' }}
        env:
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
          KAMYABI_ADMIN_API_KEY: ${{ secrets.KAMYABI_ADMIN_API_KEY }}
        run: |
          python stage_missing_reviewed.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('output/reviewed-staging.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## Automatic reviewed-job staging\\n\\n')
              out.write(f"- New jobs staged: **{report['submitted']}**\\n")
              out.write(f"- Already in admin: **{len(report['already_in_admin'])}**\\n")
              out.write(f"- Duplicate notices held: **{len(report['held'])}**\\n")
          PY

      - name: Validate optionally supplied reviewed jobs
        if: ${{ inputs.reviewed_jobs_json != '' }}
        env:
          REVIEWED_JOBS_JSON: ${{ inputs.reviewed_jobs_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          doc = json.loads(os.environ['REVIEWED_JOBS_JSON'])
          if not isinstance(doc, dict) or doc.get('reviewed') is not True:
              raise SystemExit('Only explicitly reviewed jobs can be submitted')
          Path('/tmp/kamyabi-reviewed-jobs.json').write_text(json.dumps(doc))
          PY
          python submit_jobs.py --file /tmp/kamyabi-reviewed-jobs.json --output output/reviewed-preview.json

      - name: Submit verified jobs to Kamyabi pending queue
        if: ${{ inputs.submit_reviewed == true }}
        env:
          REVIEWED_JOBS_JSON: ${{ inputs.reviewed_jobs_json }}
          REVIEWED_FILENAME: ${{ inputs.reviewed_filename }}
          KAMYABI_API_KEY: ${{ secrets.KAMYABI_API_KEY }}
        run: |
          test -n "$KAMYABI_API_KEY" || { echo "::error::Set the KAMYABI_API_KEY GitHub Actions secret to match GoDaddy IMPORT_API_KEY"; exit 1; }
          if [ -n "$REVIEWED_JOBS_JSON" ]; then
            python submit_jobs.py --file /tmp/kamyabi-reviewed-jobs.json --submit --output output/reviewed-submission.json
          else
            test -n "$REVIEWED_FILENAME" || { echo "::error::Specify one reviewed_filename to avoid resubmitting all pending records"; exit 1; }
            case "$REVIEWED_FILENAME" in
              reviewed-*-jobs.json) ;;
              *) echo "::error::Invalid reviewed_filename pattern"; exit 1 ;;
            esac
            test -f "$REVIEWED_FILENAME" || { echo "::error::Reviewed file not found"; exit 1; }
            python auto_import.py --submit --files "$REVIEWED_FILENAME"
          fi
          echo 'Only explicitly reviewed jobs were eligible for pending-review submission; no automatic public publication.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check pending-job access and approve when scheduled
        env:
          KAMYABI_ADMIN_API_KEY: ${{ secrets.KAMYABI_ADMIN_API_KEY }}
          SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish_eligible == true }}
        run: |
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            python auto_publish.py --publish
          else
            python auto_publish.py
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('output/automatic-publishing.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## Lightweight automatic publication\\n\\n')
              out.write(f"- Status: **{result['status']}**\\n")
              out.write(f"- Approved: **{len(result.get('approved', []))}**\\n")
              out.write(f"- Held: **{len(result.get('held', []))}**\\n")
          if result['status'] != 'ok':
              raise SystemExit('Admin pending-job preview unavailable; see report, no approvals attempted')
          PY

      - name: Confirm approved jobs appear in public API
        if: ${{ github.event_name == 'schedule' || inputs.publish_eligible == true }}
        run: |
          python verify_publications.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('output/verified-publications.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## Public listing verification\\n\\n')
              out.write(f"- Newly approved and publicly visible: **{len(report['visible'])}**\\n")
              out.write(f"- Approved but missing publicly: **{len(report['missing'])}**\\n")
          PY

      - name: Verify new ONGC apprentice advertisement (read-only)
        run: python verify_ongc_apprentice_pdf.py

      - name: Inspect existing POWERGRID and ONGC records (read-only)
        env:
          KAMYABI_ADMIN_API_KEY: ${{ secrets.KAMYABI_ADMIN_API_KEY }}
        run: python inspect_existing_job_dates.py

      - name: Audit live public jobs for expired dates and broken metadata
        run: |
          python audit_public_jobs.py || echo "::warning::Public-job quality audit unavailable; inspect report"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('output/job-quality/public-job-audit.json')
          if path.exists():
              report = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('\\n## Public vacancy quality audit (read-only)\\n\\n')
                  out.write(f"- Public records checked: **{report['public_job_records']}**\\n")
                  for issue, count in report['issue_counts'].items():
                      out.write(f"- {issue}: **{count}**\\n")
          PY

      - name: Summarize actual import and publication results
        if: always()
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(name):
              path = Path('output') / name
              try:
                  return json.loads(path.read_text()) if path.exists() else None
              except (OSError, ValueError):
                  return None

          apify = read('summary.json') or {}
          staging = read('reviewed-staging.json')
          publication = read('automatic-publishing.json')
          verification = read('verified-publications.json')
          draft = read('official-coverage/evidence-enriched-review.json') or {}
          event = os.environ.get('RUN_EVENT', '')
          report = {
              'event': event,
              'raw_apify_candidates': apify.get('unique_candidate_rows', 0),
              'official_notice_drafts_needing_review': len(draft.get('candidates', [])),
              'new_jobs_staged': staging.get('submitted') if staging else None,
              'staging_status': staging.get('status') if staging else 'not_run',
              'jobs_approved': len(publication.get('approved', [])) if publication else None,
              'approval_status': publication.get('status') if publication else 'not_run',
              'approved_and_publicly_visible': len(verification.get('visible', [])) if verification else None,
              'publication_verification_status': 'completed' if verification else 'not_run',
          }
          path = Path('output/final-daily-outcome.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2))
          def shown(value):
              return 'not run' if value is None else str(value)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\\n## Final vacancy import outcome\\n\\n')
              out.write(f"- Workflow event: **{event}**\\n")
              out.write(f"- Raw Apify candidates (not verified): **{report['raw_apify_candidates']}**\\n")
              out.write(f"- Official notice drafts awaiting fact review: **{report['official_notice_drafts_needing_review']}**\\n")
              out.write(f"- New reviewed jobs staged: **{shown(report['new_jobs_staged'])}** ({report['staging_status']})\\n")
              out.write(f"- Jobs approved: **{shown(report['jobs_approved'])}** ({report['approval_status']})\\n")
              out.write(f"- Newly approved jobs confirmed public: **{shown(report['approved_and_publicly_visible'])}**\\n")
              if event != 'schedule':
                  out.write('- This was not the daily scheduled run; automatic staging and public confirmation may be skipped.\\n')
              elif report['new_jobs_staged'] == 0:
                  out.write('- No new reviewed repository vacancies needed staging; raw notice collection does not create publishable records.\\n')
              if report['staging_status'] == 'error' or report['approval_status'] not in ('ok', 'not_run'):
                  out.write('- **Attention:** an import/approval stage needs investigation; see the corresponding report.\\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apify-kamyabi-review
          path: output/
          retention-days: 30
          if-no-files-found: warn
